version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: abs_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: abs_db
      MYSQL_USER: abs_user
      MYSQL_PASSWORD: abs_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - abs_network

  redis:
    image: redis:7-alpine
    container_name: abs_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - abs_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abs_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=abs_user
      - DB_PASSWORD=abs_password
      - DB_NAME=abs_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MOODLE_URL=${MOODLE_URL}
      - MOODLE_TOKEN=${MOODLE_TOKEN}
      - SOIS_API_KEY=${SOIS_API_KEY}
    depends_on:
      - db
      - redis
    networks:
      - abs_network

volumes:
  db_data:
  redis_data:

networks:
  abs_network:
    driver: bridge
