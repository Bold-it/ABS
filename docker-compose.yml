  db:
    image: postgres:15
    container_name: abs_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: abs_password
      POSTGRES_DB: abs_db
    ports:
      - "5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mariadb:
    image: public.ecr.aws/bitnami/mariadb:11.4
    container_name: abs_mariadb
    restart: always
    environment:
      - MARIADB_USER=bn_moodle
      - MARIADB_PASSWORD=abs_moodle_password
      - MARIADB_DATABASE=bitnami_moodle
      - ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - mariadb_data:/bitnami/mariadb

  moodle:
    image: public.ecr.aws/bitnami/moodle:4.4
    container_name: abs_moodle
    restart: always
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      - MOODLE_DATABASE_TYPE=mariadb
      - MOODLE_DATABASE_HOST=mariadb
      - MOODLE_DATABASE_PORT_NUMBER=3306
      - MOODLE_DATABASE_USER=bn_moodle
      - MOODLE_DATABASE_PASSWORD=abs_moodle_password
      - MOODLE_DATABASE_NAME=bitnami_moodle
      - MOODLE_USERNAME=admin
      - MOODLE_PASSWORD=AdminPassword123
      - MOODLE_EMAIL=admin@example.com
      - ALLOW_EMPTY_PASSWORD=yes
    depends_on:
      - mariadb
    volumes:
      - moodle_data:/bitnami/moodle
      - moodle_data_persistence:/bitnami/moodle_data

  redis:
    image: redis:7
    container_name: abs_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  mariadb_data:
  moodle_data:
  moodle_data_persistence:
